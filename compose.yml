services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle check || bundle install && bin/rails db:prepare && bin/dev"
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      LISTEN_FORCE_POLLING: "1"
      OMR_URL: http://omr:8000
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      omr:
        condition: service_started
    tty: true
    stdin_open: true

  # Leitor de cartões-resposta (Python + OpenCV). Veja omr/README.md
  omr:
    build: ./omr
    command: uvicorn omr.server:app --host 0.0.0.0 --port 8000 --reload
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./omr:/omr
    ports:
      - "8000:8000"

volumes:
  pgdata:
  bundle:
